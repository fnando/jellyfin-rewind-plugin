framework: "net10.0"
overview: "A durable, per-user play history for every media type"
description: >
  Records every playback session (movies, episodes, music, audiobooks, music
  videos, live TV and anything else Jellyfin plays) in a plugin-owned database,
  straight from the server's playback events. Serves the history through a
  filterable, paginated, user-scoped API and an incremental changes feed, so
  scrobblers and trackers in the style of Trakt or Last.fm have a source of
  truth that does not depend on webhooks.
